<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />

  <title>Apple of Fortune Hacker 2.2</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Manifest PWA -->
  <link rel="manifest" href="data:application/json;base64,ewogICAgIm5hbWUiOiAiQXBwbGUgb2YgRm9ydHVuZSIsCiAgICAic2hvcnRfbmFtZSI6ICJBUEYiLAogICAgInN0YXJ0X3VybCI6ICIuLyIsCiAgICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAgICJ0aGVtZV9jb2xvciI6ICIjMDAwMDAwIiwKICAgICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwMDAwMDAiCn0=" />

  <style>
    body {
      font-family: 'Courier New', monospace;
      background-color: #000;
      color: #00ff00;
    }
    .glow {
      text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00;
    }
    .input-field {
      background-color: #111;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 0.75rem;
      border-radius: 0.5rem;
      width: 100%;
      margin-bottom: 0.75rem;
      transition: all 0.3s ease;
    }
    .button-green {
      background-color: #00ff00;
      color: #000;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-weight: bold;
      text-transform: uppercase;
      transition: background-color 0.3s ease, transform 0.2s;
    }
    .button-green:hover {
      background-color: #00cc00;
      transform: translateY(-2px);
    }
    .bookmaker-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: inline-block;
      margin-left: 0.5rem;
    }
    .background-animation {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      color: #00ff00;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 8s steps(40, end) infinite;
      border-right: 2px solid #00ff00;
    }
    @keyframes typing {
      0% { width: 0; }
      50% { width: 100%; }
      100% { width: 0; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Login -->
  <div id="authPage" class="w-full max-w-sm text-center">
    <h1 class="text-3xl font-bold glow mb-4">Apple of Fortune Hacker 2.2</h1>
    <input type="text" id="loginUser" placeholder="Votre ID ou Username" class="input-field" />
    <input type="password" id="loginPass" placeholder="Mot de passe" class="input-field" />
    <button onclick="login()" class="button-green w-full mb-3">Connexion</button>
    <button onclick="showRegister()" class="button-green w-full bg-blue-500 hover:bg-blue-600">Inscription</button>
  </div>

  <!-- Register -->
  <div id="registerPage" class="hidden w-full max-w-sm text-center">
    <h1 class="text-3xl font-bold glow mb-4">Créer un compte</h1>
    <input type="text" id="registerUsername" placeholder="Nom d'utilisateur" class="input-field" />
    <input type="text" id="registerUserId" placeholder="ID Bookmaker" class="input-field" />
    <select id="registerBookmaker" class="input-field">
      <option value="" disabled selected>Choisissez votre bookmaker</option>
      <option value="1xbet">1XBET</option>
      <option value="Paripesa">Paripesa</option>
      <option value="Melbet">Melbet</option>
    </select>
    <input type="password" id="registerPass" placeholder="Mot de passe" class="input-field" />
    <input type="password" id="registerPassConfirm" placeholder="Confirmez le mot de passe" class="input-field" />
    <button onclick="register()" class="button-green w-full mb-3">S'inscrire</button>
    <button onclick="showLogin()" class="button-green w-full bg-gray-500 hover:bg-gray-600">Retour</button>
  </div>

  <!-- Main Interface -->
  <div id="mainPage" class="hidden w-full max-w-sm text-center">
    <h2 class="text-xl glow mb-2">Bienvenue <span id="userWelcome"></span></h2>
    <p class="text-green-400 mb-4 flex justify-center items-center">Bookmaker : <span id="userBookmaker" class="ml-2"></span></p>
    <button onclick="generateResults()" class="button-green w-full mb-3">Obtenir la prédiction</button>
    <p id="loading" class="text-yellow-400 mb-3 hidden">Analyse IA en cours...</p>
    <div id="results" class="text-2xl glow"></div>
    <button onclick="logout()" class="button-green bg-red-500 hover:bg-red-600 mt-4">Déconnexion</button>
  </div>

  <!-- Footer Animation -->
  <div class="background-animation text-xs"># Initialisation # Chargement IA # Calcul # Prédictions # Terminé...</div>

  <!-- Service Worker inline -->
  <script>
    const swCode = `
      const CACHE_NAME = 'apple-fortune-v2';
      const urlsToCache = ['./'];
      self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(urlsToCache))));
      self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      self.addEventListener('activate', e => e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))))));
    `;

    if ('serviceWorker' in navigator) {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).then(() => console.log('Service Worker enregistré !'));
    }
  </script>

  <!-- App logic -->
  <script>
    let users = []; // Simulated users
    let currentUser = null;

    function showLogin() {
      document.getElementById('registerPage').classList.add('hidden');
      document.getElementById('authPage').classList.remove('hidden');

      if (currentUser) {
        document.getElementById('loginUser').value = currentUser.userId;
      }
    }

    function showRegister() {
      document.getElementById('authPage').classList.add('hidden');
      document.getElementById('registerPage').classList.remove('hidden');
    }

    function register() {
      const username = document.getElementById('registerUsername').value.trim();
      const userId = document.getElementById('registerUserId').value.trim();
      const bookmaker = document.getElementById('registerBookmaker').value;
      const pass = document.getElementById('registerPass').value.trim();
      const passConfirm = document.getElementById('registerPassConfirm').value.trim();

      if (!username || !userId || !bookmaker || !pass || !passConfirm) {
        alert("Complétez tous les champs !");
        return;
      }

      if (pass !== passConfirm) {
        alert("Les mots de passe ne correspondent pas !");
        return;
      }

      if (users.find(u => u.userId === userId)) {
        alert("Cet ID de bookmaker existe déjà !");
        return;
      }

      currentUser = { username, userId, bookmaker, pass };
      users.push(currentUser);

      // Auto-login après inscription
      document.getElementById('registerPage').classList.add('hidden');
      showMainPage();
    }

    function login() {
      const userInput = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      const user = users.find(u => (u.userId === userInput || u.username === userInput) && u.pass === pass);
      if (!user) {
        alert("Identifiants incorrects !");
        return;
      }

      currentUser = user;
      showMainPage();
    }

    function showMainPage() {
      document.getElementById('authPage').classList.add('hidden');
      document.getElementById('registerPage').classList.add('hidden');
      document.getElementById('mainPage').classList.remove('hidden');

      document.getElementById('userWelcome').innerText = currentUser.username;
      const bookmakerDisplay = `${currentUser.bookmaker}`;
      const bookmakerLogo = getBookmakerLogo(currentUser.bookmaker);
      document.getElementById('userBookmaker').innerHTML = bookmakerDisplay + bookmakerLogo;
    }

    function logout() {
      currentUser = null;
      document.getElementById('mainPage').classList.add('hidden');
      document.getElementById('authPage').classList.remove('hidden');
    }

    function generateResults() {
      if (!currentUser) {
        alert("Vous devez être connecté !");
        return;
      }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').innerText = '';

      setTimeout(() => {
        const apples = ['🍏', '🍏', '🍏', '🍏', '❌'];
        const shuffled = apples.sort(() => Math.random() - 0.5);
        document.getElementById('results').innerText = shuffled.join(' ');
        document.getElementById('loading').classList.add('hidden');
      }, 2000);
    }

    function getBookmakerLogo(bookmaker) {
      let imgSrc = '';
      switch (bookmaker) {
        case '1xbet': imgSrc = 'https://cdn-icons-png.flaticon.com/512/732/732229.png'; break;
        case 'Paripesa': imgSrc = 'https://cdn-icons-png.flaticon.com/512/732/732245.png'; break;
        case 'Melbet': imgSrc = 'https://cdn-icons-png.flaticon.com/512/732/732190.png'; break;
      }
      return `<img src="${imgSrc}" alt="${bookmaker}" class="bookmaker-logo" />`;
    }
  </script>
</body>
</html>
